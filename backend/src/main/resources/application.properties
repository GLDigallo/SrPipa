# Servidor
server.port=${PORT:8080}

# Base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:srpipa}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:ZGVmYXVsdC1zZWNyZXQtZm9yLWRldmVsb3BtZW50LWNoYW5nZS1pbi1wcm9kdWN0aW9u}
app.jwt.expiration-ms=86400000

# WhatsApp
app.whatsapp.numero=${WHATSAPP_NUMERO:+5493795595375}

# CORS
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://192.168.1.4:5173}

# Uploads
app.upload.productos=${UPLOAD_PRODUCTOS:uploads/productos}
app.upload.secciones=${UPLOAD_SECCIONES:uploads/secciones}

# Logs
logging.level.com.srpipa=INFO
logging.level.org.springframework.security=WARN
